<!DOCTYPE html>
<html>
<head>
    <title>Task Tracker Analytics</title>
</head>
<body>
    <h1>Upload CSV Files</h1>
    <form action="/upload" method="post" enctype="multipart/form-data">
        <label for="epics">Epics CSV:</label>
        <input type="file" id="epics" name="epics" required><br>

        <label for="stories">Stories CSV:</label>
        <input type="file" id="stories" name="stories" required><br>

        <label for="tasks">Tasks CSV:</label>
        <input type="file" id="tasks" name="tasks" required><br>

        <button type="submit">Upload</button>
    </form>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Results</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h1>Task Results</h1>
        <table class="table table-bordered mt-3">
            <thead>
                <tr>
                    <th>Task ID</th>
                    <th>Task Subject</th>
                    <th>Story Subject</th>
                    <th>Epic Subject</th>
                </tr>
            </thead>
            <tbody>
                {% for task in tasks %}
                    <tr>
                        <td>{{ task['id'] }}</td>
                        <td>{{ task['subject'] }}</td>
                        <td>{{ task['story_subject'] }}</td>
                        <td>{{ task['epic_subject'] }}</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
